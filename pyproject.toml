[project]
name = "sre-copilot"
version = "0.1.0"
description = "Agentic incident-response copilot: investigates alerts with read-only tools and proposes remediations behind a human approval gate."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ratul Sikder" }]
keywords = ["sre", "aiops", "incident-response", "kubernetes", "anthropic", "agents", "llm"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=2.13.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "kubernetes>=37.0.3",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sre-copilot = "sre_copilot.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT", "RET", "C4", "PTH", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Option", "typer.Argument", "fastapi.Header", "fastapi.Depends", "fastapi.Query",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: requires the kind demo cluster (deselected by default)"]
