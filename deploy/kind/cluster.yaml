# Single-node kind cluster for the sre-copilot demo.
# Prometheus and Loki are exposed on the host via NodePorts.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sre-copilot
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30090 # prometheus
        hostPort: 39090
        listenAddress: "127.0.0.1"
      - containerPort: 30100 # loki
        hostPort: 39100
        listenAddress: "127.0.0.1"
