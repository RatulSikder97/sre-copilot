apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc:8080"]
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
  rules.yml: |
    groups:
      - name: demo-workloads
        rules:
          - alert: KubePodCrashLooping
            expr: |
              max by (namespace, pod, container) (
                kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", namespace="demo"}
              ) >= 1
            for: 20s
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
              description: "Container {{ $labels.container }} of pod {{ $labels.pod }} is in CrashLoopBackOff."
              runbook: "runbooks/crashloopbackoff.md"
          - alert: KubeContainerOOMKilled
            expr: |
              max by (namespace, pod, container) (
                kube_pod_container_status_last_terminated_reason{reason="OOMKilled", namespace="demo"}
              ) == 1
              and on (namespace, pod, container)
              increase(kube_pod_container_status_restarts_total{namespace="demo"}[5m]) > 0
            for: 0s
            labels:
              severity: critical
            annotations:
              summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled"
              description: "The container exceeded its memory limit and was killed by the kernel."
              runbook: "runbooks/oomkilled.md"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1d
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
